<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="異常看板">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>珍有福 異常處理看板</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --primary: #2563eb; --primary-dk: #1d4ed8;
  --bg: #f1f5f9; --card: #fff; --border: #e2e8f0;
  --text: #1e293b; --muted: #64748b;
  --green: #16a34a; --red: #dc2626; --orange: #d97706;
}
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 30px; }

.header { background: var(--primary); color: #fff; padding: 14px 16px; position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 6px rgba(0,0,0,0.12); }
.header-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.header h1 { font-size: 16px; font-weight: 800; }
.refresh-btn { background: rgba(255,255,255,0.2); border: none; color: #fff; border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 700; cursor: pointer; flex-shrink: 0; }
.refresh-btn:active { background: rgba(255,255,255,0.35); }
.header-sub { font-size: 11px; opacity: 0.85; margin-top: 4px; }

.board { padding: 12px; max-width: 640px; margin: 0 auto; }

.stats-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 14px; }
.stat-card { background: var(--card); border-radius: 10px; padding: 10px 6px; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
.stat-label { font-size: 11px; color: var(--muted); font-weight: 700; }
.stat-value { font-size: 20px; font-weight: 800; margin-top: 2px; }
.stat-value.orange { color: var(--orange); }
.stat-value.blue { color: var(--primary); }
.stat-value.green { color: var(--green); }

.section-title { font-size: 14px; font-weight: 800; margin: 4px 0 10px; display: flex; align-items: center; gap: 6px; }
.count-badge { background: var(--border); color: var(--text); font-size: 11px; font-weight: 800; border-radius: 10px; padding: 1px 8px; }

.issue-card { background: var(--card); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); }
.issue-card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; gap: 8px; }
.case-no { font-size: 11px; color: var(--muted); font-family: monospace; }
.issue-status { display: inline-block; padding: 2px 9px; border-radius: 6px; font-size: 11px; font-weight: 800; white-space: nowrap; }
.issue-status.pending { background: #fef3c7; color: #92400e; }
.issue-status.processing { background: #dbeafe; color: #1d4ed8; }
.issue-status.closed { background: #dcfce7; color: #166534; }
.issue-card-main { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
.store-name { font-size: 14px; font-weight: 800; }
.product-name { font-size: 14px; font-weight: 700; }
.issue-type-tag { display: inline-block; background: #f1f5f9; color: var(--text); font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 5px; }
.issue-card-meta { font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.6; }
.issue-desc { font-size: 13px; margin-top: 8px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
.photo-preview { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.photo-thumb { width: 64px; height: 64px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); display: block; }
.photo-thumb img { width: 100%; height: 100%; object-fit: cover; }
.resolved-box { margin-top: 8px; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px; padding: 8px 10px; font-size: 12px; color: #166534; line-height: 1.7; }
.processing-box { margin-top: 8px; background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 8px; padding: 8px 10px; font-size: 12px; color: #1d4ed8; line-height: 1.7; }

.closed-section { margin-top: 18px; }
.closed-section summary { font-size: 14px; font-weight: 800; cursor: pointer; padding: 12px 14px; background: var(--card); border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); display: flex; align-items: center; gap: 6px; list-style: none; }
.closed-section summary::-webkit-details-marker { display: none; }
.closed-section summary::after { content: attr(data-label-collapsed); margin-left: auto; color: var(--muted); font-size: 12px; font-weight: 700; }
.closed-section[open] summary::after { content: attr(data-label-expanded); }
.lang-btn { background: rgba(255,255,255,0.2); border: none; color: #fff; border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 800; cursor: pointer; flex-shrink: 0; letter-spacing: 1px; }
.lang-btn:active { background: rgba(255,255,255,0.35); }
.closed-section[open] summary { border-radius: 12px 12px 0 0; }
.closed-section > .closed-list { padding-top: 10px; }

.empty-msg { text-align: center; color: var(--muted); padding: 30px 20px; font-size: 13px; background: var(--card); border-radius: 12px; }
.loading-msg { text-align: center; color: var(--muted); padding: 40px 20px; font-size: 13px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <h1 id="boardTitle">🚨 珍有福 異常處理看板</h1>
    <div style="display:flex;align-items:center;gap:8px">
      <button class="lang-btn" id="boardLangBtn" onclick="toggleBoardLang()">日本語</button>
      <button class="refresh-btn" id="boardRefreshBtn" onclick="loadAll()">🔄 重新整理</button>

</div>

<div class="board">

  <div class="section-title">🔴 <span id="activeTitleText">進行中案件</span> <span class="count-badge" id="activeCount">0</span></div>
  <div id="activeList"><div class="loading-msg">載入中…</div></div>

  <details class="closed-section" id="closedDetails">
    <summary>✅ <span id="closedTitleText">已結案紀錄（近4週）</span> <span class="count-badge" id="closedCount">0</span></summary>
    <div class="closed-list" id="closedList"></div>
  </details>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

// 靜態門市對照表（store_key → 顯示名稱）作為 fallback

  '台南中正':'珍有福 台南中正店', '台北內湖':'珍有福 台北內湖店', '龜山文青':'珍有福 龜山文青店',

  '桃園經國':'珍有福 桃園經國店', '台南仁德':'珍有福 台南仁德店', '高雄新楠':'珍有福 高雄新楠店',

};

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function pad(n) { return String(n).padStart(2, '0'); }
function fmtDateTime(s) {
  const d = new Date(s);
  return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function fmtDate(s) {
  const d = new Date(s);
  return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}`;
}
function getMonday(date) {
  const d = new Date(date);
  const day = d.getDay();
  const diff = (day === 0 ? -6 : 1) - day;
  d.setDate(d.getDate() + diff);
  d.setHours(0,0,0,0);
  return d;
}
function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }

// 取得「本週」範圍起點：上週五 00:00（截至目前時刻為止都算本週）
// 例如：今天若為本週一~本週日，「上週五」固定為上一個週五 00:00
function getCaseWeekStart(date) {
  return addDays(getMonday(date), -3);
}

// 提報人姓名遮蔽：固定遮蔽第二個字，例如「王小明」→「王*明」
function maskReporter(name) {
  if (!name) return '—';
  if (name.length < 2) return name;
  return name[0] + '*' + name.slice(2);
}

// ========================
// 中／日語系統
// ========================
const T_BOARD = {
  zh: {
    title: '🚨 珍有福 異常處理看板',
    langBtn: '日本語',
    refresh: '🔄 重新整理',
    loading: '載入中…',
    loadError: '讀取失敗：',
    loadErrorMsg: '資料讀取失敗，請稍後重新整理',
    updatedAtPrefix: '更新時間：', updatedAtSuffix: '（每2分鐘自動更新）',
    statPending: '待處理', statProcessing: '處理中', statClosed4w: '本週以前已結案',
    activeTitle: '進行中案件', closedTitle: '已結案紀錄（本週以前）',
    expandLabel: '展開 ▾', collapseLabel: '收合 ▴',
    emptyActive: '目前沒有待處理或處理中的案件 🎉', emptyClosed: '本週以前無已結案紀錄',
    metaReportTime: '📅 通報時間：', metaReporter: '提報人：',
    metaQty: '問題數量：', metaRemain: '同批剩餘庫存：',
    batchProdDate: '生產日期', batchNo: '批號',
    respLabel: '責任歸屬：', resoLabel: '處理方式：', handlerNotesLabel: '處理說明：', closedAtLabel: '結案時間：',
  },
  ja: {
    title: '🚨 Joyfull珍有福 異常対応ボード',
    langBtn: '中文',
    refresh: '🔄 更新',
    loading: '読み込み中…',
    loadError: '読み込み失敗：',
    loadErrorMsg: 'データの取得に失敗しました。後でもう一度お試しください',
    updatedAtPrefix: '更新日時：', updatedAtSuffix: '（2分ごとに自動更新）',
    statPending: '未対応', statProcessing: '対応中', statClosed4w: '今週より前の完了',
    activeTitle: '対応中の案件', closedTitle: '完了記録（今週より前）',
    expandLabel: '開く ▾', collapseLabel: '閉じる ▴',
    emptyActive: '現在、未対応・対応中の案件はありません 🎉', emptyClosed: '今週より前の完了記録はありません',
    metaReportTime: '📅 通報日時：', metaReporter: '報告者：',
    metaQty: '問題数量：', metaRemain: '同ロット残数：',
    batchProdDate: '製造日', batchNo: 'ロット番号',
    respLabel: '責任の所在：', resoLabel: '対応方法：', handlerNotesLabel: '対応内容：', closedAtLabel: '完了日：',
  },
};

// 中→日 顯示對照（資料庫值維持中文，僅顯示時依語言轉換）
const ISSUE_TYPE_JA = {'異物':'異物混入','品質':'品質（変質・食感・カビ等）','保存期限':'賞味期限','數量短缺':'数量不足','包裝':'梱包（破損・封緘不良）','其他':'その他'};
const ISSUE_STATUS_JA = {'待處理':'未対応','處理中':'対応中','已結案':'完了'};
const ISSUE_RESP_JA = {'原料供應商':'原材料サプライヤー','央廚-生產':'セントラルキッチン-製造','央廚-包裝':'セントラルキッチン-梱包','物流配送':'配送','門市操作':'店舗オペレーション','其他':'その他'};
const ISSUE_RESO_JA = {'原門市報廢':'店舗で廃棄','退回央廚':'セントラルキッチンへ返品','換貨補寄':'交換・再送','其他':'その他'};

let boardLang = localStorage.getItem('boardLang') === 'ja' ? 'ja' : 'zh';
function tb(key) { return T_BOARD[boardLang]?.[key] ?? T_BOARD.zh[key] ?? key; }
function issLabelB(zh, map) { return boardLang === 'ja' ? (map[zh] || zh) : zh; }

function toggleBoardLang() {
  boardLang = boardLang === 'zh' ? 'ja' : 'zh';
  localStorage.setItem('boardLang', boardLang);
  applyBoardLang();
  loadAll();
}

function applyBoardLang() {
  document.title = boardLang === 'ja' ? 'Joyfull珍有福 異常対応ボード' : '珍有福 異常處理看板';
  document.documentElement.lang = boardLang === 'ja' ? 'ja' : 'zh-TW';
  document.getElementById('boardTitle').textContent = tb('title');
  document.getElementById('boardLangBtn').textContent = tb('langBtn');
  document.getElementById('boardRefreshBtn').textContent = tb('refresh');
  document.getElementById('activeTitleText').textContent = tb('activeTitle');
  document.getElementById('closedTitleText').textContent = tb('closedTitle');
  const summary = document.querySelector('#closedDetails > summary');
  summary.dataset.labelCollapsed = tb('expandLabel');
  summary.dataset.labelExpanded = tb('collapseLabel');
}

function renderCard(it, isClosed) {
  const statusCls = it.status === '待處理' ? 'pending' : it.status === '處理中' ? 'processing' : 'closed';
  const storeName = dynamicStoreNames[it.store_key] || STORE_NAMES[it.store_key] || it.store_key;
  const qty = it.quantity_affected != null ? `${it.quantity_affected}${it.quantity_unit || ''}` : '—';
  const remain = it.remaining_stock_qty != null ? `${it.remaining_stock_qty}${it.quantity_unit || ''}` : '—';

  const batchInfo = [];
  if (it.production_date) batchInfo.push(`${tb('batchProdDate')} ${it.production_date}`);
  if (it.batch_no) batchInfo.push(`${tb('batchNo')} ${it.batch_no}`);

  const photos = (it.photos || []).map(url =>
    `<a class="photo-thumb" href="${esc(url)}" target="_blank" rel="noopener"><img src="${esc(url)}" loading="lazy"></a>`
  ).join('');

  let resolvedInfo = '';
  if (it.status === '已結案') {
    const parts = [];
    if (it.responsibility) parts.push(`${tb('respLabel')}${issLabelB(it.responsibility, ISSUE_RESP_JA)}`);
    if (it.resolution) parts.push(`${tb('resoLabel')}${issLabelB(it.resolution, ISSUE_RESO_JA)}`);
    if (it.handler_notes) parts.push(`${tb('handlerNotesLabel')}${it.handler_notes}`);
    if (it.closed_at) parts.push(`${tb('closedAtLabel')}${fmtDate(it.closed_at)}`);
    if (parts.length) resolvedInfo = `<div class="resolved-box">${parts.map(p => `<div>${esc(p)}</div>`).join('')}</div>`;
  } else if (it.status === '處理中' && it.handler_notes) {
    resolvedInfo = `<div class="processing-box"><div>🔧 ${tb('handlerNotesLabel')}${esc(it.handler_notes)}</div></div>`;
  }

  return `<div class="issue-card">
    <div class="issue-card-top">
      <span class="issue-status ${statusCls}">${esc(issLabelB(it.status, ISSUE_STATUS_JA))}</span>
      <span class="case-no">${esc(it.case_no || '')}</span>
    </div>
    <div class="issue-card-main">
      <span class="store-name">${esc(storeName)}</span>
      <span class="product-name">${esc(it.product_name)}</span>
      <span class="issue-type-tag">${esc(issLabelB(it.issue_type, ISSUE_TYPE_JA))}</span>
    </div>
    <div class="issue-card-meta">${tb('metaReportTime')}${fmtDateTime(it.created_at)}　|　${tb('metaReporter')}${esc(maskReporter(it.reporter_name))}</div>
    <div class="issue-card-meta">${tb('metaQty')}${esc(qty)}　|　${tb('metaRemain')}${esc(remain)}</div>
    ${batchInfo.length ? `<div class="issue-card-meta">${batchInfo.map(esc).join('　|　')}</div>` : ''}
    <div class="issue-desc">${esc(it.description)}</div>
    ${photos ? `<div class="photo-preview">${photos}</div>` : ''}
    ${resolvedInfo}
  </div>`;
}

// 動態門市名稱 map（從 settings 載入後補充 STORE_NAMES）
let dynamicStoreNames = {};

async function loadAll() {
  document.getElementById('updatedAt').textContent = tb('loading');
  // 同時載入案件資料與後台門市名稱設定（anon 可讀）
  const [{ data, error }, { data: siData }, { data: skData }] = await Promise.all([
    sb.from('product_issues').select('*').order('created_at', { ascending: true }),
    sb.from('settings').select('value').eq('key','store_info_overrides').maybeSingle(),
    sb.from('settings').select('value').eq('key','store_key_overrides').maybeSingle(),
  ]);
  // 將後台 fullName overrides 補入動態 map（store_key → fullName）
  const infoOv = siData?.value || {};
  Object.entries(infoOv).forEach(([k, v]) => { if (v?.fullName) dynamicStoreNames[k] = v.fullName; });
  // store_key_overrides 是 code→newKey，這裡記下 newKey，讓顯示格式一致（fallback 用 '珍有福 ' + newKey）
  // 新 key 若不在 STORE_NAMES，renderIssue 會使用 dynamicStoreNames[store_key] 或 fallback
  const keyOv = skData?.value || {};
  Object.values(keyOv).forEach(newKey => {
    if (!STORE_NAMES[newKey] && !dynamicStoreNames[newKey]) {
      dynamicStoreNames[newKey] = `珍有福 ${newKey}`;
    }
  });
  if (error) {
    document.getElementById('updatedAt').textContent = tb('loadError') + error.message;
    document.getElementById('activeList').innerHTML = `<div class="empty-msg">${tb('loadErrorMsg')}</div>`;
    return;
  }
  const all = data || [];

  // 「本週」範圍：上週五 00:00 ~ 截至目前時刻
  const weekStart = getCaseWeekStart(new Date());
  const closedCutoff = addDays(weekStart, -21); // 再往前3週（含本週共4週的可視範圍）

  // 進行中案件：尚未結案者，或「本週發生」且已結案者（仍顯示，待確認後再收合）
  const active = all.filter(it => {
    if (it.status !== '已結案') return true;
    const created = new Date(it.created_at);
    return created >= weekStart;
  });

  // 已結案紀錄（本週以前，近3週內，依結案時間由新到舊）
  const closed = all.filter(it => it.status === '已結案')
    .filter(it => {
      const created = new Date(it.created_at);
      return created < weekStart && created >= closedCutoff;
    })
    .sort((a, b) => new Date(b.closed_at || b.updated_at || b.created_at) - new Date(a.closed_at || a.updated_at || a.created_at));

  // 統計（待處理／處理中為目前所有未結案案件，已結案為「本週以前」可展開的數量）
  const pending = all.filter(i => i.status === '待處理').length;
  const processing = all.filter(i => i.status === '處理中').length;
  document.getElementById('statsRow').innerHTML = `
    <div class="stat-card"><div class="stat-label">${tb('statPending')}</div><div class="stat-value orange">${pending}</div></div>
    <div class="stat-card"><div class="stat-label">${tb('statProcessing')}</div><div class="stat-value blue">${processing}</div></div>
    <div class="stat-card"><div class="stat-label">${tb('statClosed4w')}</div><div class="stat-value green">${closed.length}</div></div>
  `;

  // 進行中案件（依通報時間由舊到新，最久未處理者排最前；本週已結案者也會列在此處）
  document.getElementById('activeCount').textContent = active.length;
  document.getElementById('activeList').innerHTML = active.length
    ? active.map(it => renderCard(it, false)).join('')
    : `<div class="empty-msg">${tb('emptyActive')}</div>`;

  // 已結案紀錄（本週以前，依結案時間由新到舊）
  document.getElementById('closedCount').textContent = closed.length;
  document.getElementById('closedList').innerHTML = closed.length
    ? closed.map(it => renderCard(it, true)).join('')
    : `<div class="empty-msg">${tb('emptyClosed')}</div>`;

  const now = new Date();
  document.getElementById('updatedAt').textContent = tb('updatedAtPrefix') + fmtDateTime(now) + tb('updatedAtSuffix');
}

applyBoardLang();
loadAll();
setInterval(loadAll, 120000);
</script>
